name: Release

# On a version tag: builds the Windows installer and owlmic.exe, and opens a draft GitHub Release with
# them and their SHA-256 checksums. The Android APK is signed offline with the release key and added
# to the draft by hand before it is published.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Build the Windows downloads
    uses: ./.github/workflows/windows-installer.yml

  draft:
    name: Open the draft release
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Download the Windows build
        uses: actions/download-artifact@v7
        with:
          name: owlmic-windows
          path: dist

      - name: Write checksums
        working-directory: dist
        run: sha256sum *.exe > SHA256SUMS

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --draft --generate-notes
          --title "Owlmic $GITHUB_REF_NAME"
