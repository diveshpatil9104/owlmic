name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pc-checks:
    name: PC (Rust) on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pc/target
          key: cargo-${{ runner.os }}-${{ hashFiles('pc/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Ensure softcam.dll
        shell: pwsh
        run: |
          if (-not (Test-Path "pc\softcam.dll")) {
            $expectedHash = '9D635E0AF682A883C3C7D407513D47E59B0883771701B101216820DFCF997F0B'
            $url = 'https://raw.githubusercontent.com/diveshpatil9104/owlmic/3f78b5767f64f4542b4307c586da4b609d54d38e/pc/softcam.dll'
            Invoke-WebRequest -Uri $url -OutFile pc\softcam.dll -UseBasicParsing
            $hash = (Get-FileHash pc\softcam.dll -Algorithm SHA256).Hash
            if ($hash -ne $expectedHash) {
              throw "Downloaded softcam.dll checksum mismatch: $hash"
            }
          }

      - name: Rustfmt
        run: cargo fmt --check --manifest-path pc/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path pc/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path pc/Cargo.toml

  android-checks:
    name: Android — Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unit Tests & Lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug
