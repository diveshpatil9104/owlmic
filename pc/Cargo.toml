[package]
name = "owlmic"
version = "0.1.0"
edition = "2021"
description = "Your Android phone as your Windows PC's microphone, camera and speaker"
license = "MIT"
repository = "https://github.com/diveshpatil9104/owlmic"
readme = "../README.md"
keywords = ["webcam", "microphone", "speaker", "virtual-camera", "windows"]
categories = ["multimedia::audio", "multimedia::video"]

[dependencies]
nnnoiseless = { version = "0.5", default-features = false }

# Unoptimized, noise suppression and resampling run about 20 times slower and the mic
# stutters, so even `cargo run` optimizes them. Ship release builds all the same.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
